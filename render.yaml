# ==========================================
# Render Blueprint Specification
# Nepal Cozy Care (PostgreSQL + Laravel Backend + React Frontend)
# ==========================================
# Use this file with Render Blueprints ("New +" -> "Blueprint")
# or follow the manual deployment guide in the walkthrough documentation.

databases:
  - name: nepal-cozy-care-db
    databaseName: nepal_cozy_care
    user: nepal_cozy_care_user
    plan: free

services:
  # ----------------------------------------
  # Laravel Backend (Docker Web Service)
  # ----------------------------------------
  - type: web
    name: nepal-cozy-care-backend
    runtime: docker
    rootDir: Nepal-Cozy-Care-backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Nepal Cozy Care"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        value: "base64:OnNFUjKLiU7dpgju9ChJji6DlDyVx+7RIJD+OcaBrRA="
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-cozy-care-db
          property: connectionString
      - key: DB_SSLMODE
        value: prefer
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CORS_SUPPORTS_CREDENTIALS
        value: "true"
      - key: FILESYSTEM_DISK
        value: public

  # ----------------------------------------
  # React Frontend (Static Site with SPA routing)
  # ----------------------------------------
  - type: web
    name: nepal-cozy-care-frontend
    env: static
    rootDir: Nepal-Cozy-Care-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_TIMEOUT
        value: "10000"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
